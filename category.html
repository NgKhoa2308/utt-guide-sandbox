<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh mục địa điểm - UTT Student Guide</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  * { font-family: 'Segoe UI', system-ui, sans-serif; }
  .gradient-header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 60%, #60a5fa 100%); }
  .card-hover { transition: transform .3s, box-shadow .3s; }
  .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,.15); }
.line-clamp-1 { display:-webkit-box; -webkit-line-clamp:1; line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .active-filter { background:#2563eb !important; color:white !important; }
</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors">

<header class="gradient-header text-white sticky top-0 z-50 shadow-lg">
  <div class="container mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <div class="bg-white/20 backdrop-blur rounded-xl p-2.5"><i class="fas fa-map-marked-alt text-2xl"></i></div>
      <div>
        <h1 class="text-lg md:text-xl font-bold leading-tight">UTT Student Guide</h1>
        <p class="text-xs text-blue-100">Cẩm nang số sinh viên UTT</p>
      </div>
    </a>
    <nav class="hidden md:flex items-center gap-5 text-sm font-medium">
      <a href="index.html" class="hover:text-yellow-300 transition"><i class="fas fa-home mr-1"></i>Trang chủ</a>
      <a href="favorites.html" class="hover:text-yellow-300 transition relative">
        <i class="fas fa-heart mr-1"></i>Yêu thích
        <span class="fav-badge absolute -top-2 -right-3 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full items-center justify-center font-bold" style="display:none;"></span>
      </a>
      <button id="darkModeBtn" class="text-xl hover:scale-110 transition">🌙</button>
    </nav>
  </div>
</header>

<section class="bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 py-5 px-4">
  <div class="container mx-auto">
    <nav class="text-sm text-gray-500 dark:text-gray-400 mb-2">
      <a href="index.html" class="hover:text-blue-600">Trang chủ</a>
      <span class="mx-2">›</span>
      <span id="breadcrumb" class="text-gray-800 dark:text-gray-100 font-semibold">Tất cả địa điểm</span>
    </nav>
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
<div>
  <h2 id="pageTitle" class="text-2xl md:text-3xl font-bold">Tất cả địa điểm</h2>
  <p id="resultCount" class="text-gray-500 dark:text-gray-400 text-sm mt-1">Đang tải...</p>
  <div class="flex gap-2 mt-2">
    <button id="randomBtn" class="text-xs bg-yellow-400 text-yellow-900 px-3 py-1.5 rounded-lg font-bold hover:bg-yellow-300 transition">
      🎲 Random
    </button>
    <button id="nearMeBtn" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-blue-700 transition">
      <i class="fas fa-location-arrow mr-1"></i>Gần tôi
    </button>
  </div>
</div>
      <div class="flex gap-2 items-center">
        <div class="flex bg-gray-100 dark:bg-gray-700 rounded-lg overflow-hidden flex-1 md:w-72">
          <input type="text" id="searchInput" placeholder="Tìm trong danh mục..."
                 class="flex-1 px-3 py-2 text-sm bg-transparent outline-none text-gray-800 dark:text-gray-100">
          <button id="searchBtn" class="bg-blue-600 text-white px-4 hover:bg-blue-700"><i class="fas fa-search text-sm"></i></button>
        </div>
        <select id="sortSelect" class="bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100 px-3 py-2 rounded-lg text-sm outline-none cursor-pointer"></select>
      </div>
    </div>
  </div>
</section>

<main class="container mx-auto px-4 py-6">
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
    <aside class="lg:col-span-1">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md p-5 lg:sticky lg:top-24">
        <h3 class="font-bold mb-4"><i class="fas fa-filter text-blue-600 mr-2"></i>Bộ lọc</h3>
        <div class="mb-5">
          <p class="text-sm font-semibold text-gray-600 dark:text-gray-300 mb-2">Danh mục</p>
          <div id="categoryFilter" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="mb-5">
          <p class="text-sm font-semibold text-gray-600 dark:text-gray-300 mb-2">Mức giá</p>
          <div id="priceFilter" class="space-y-1"></div>
        </div>
        <div class="mb-5">
          <p class="text-sm font-semibold text-gray-600 dark:text-gray-300 mb-2">Khoảng cách</p>
          <div id="distanceFilter" class="space-y-1"></div>
        </div>
        <button id="resetFilter" class="w-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition text-sm font-semibold">
          <i class="fas fa-redo mr-1"></i>Xóa bộ lọc
        </button>
      </div>
    </aside>
    <section class="lg:col-span-3">
      <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      <div id="emptyState" class="hidden text-center py-16">
        <i class="fas fa-search text-6xl text-gray-300 mb-4"></i>
        <p class="text-gray-500 dark:text-gray-400 text-lg">Không tìm thấy địa điểm nào</p>
        <button id="clearSearch" class="mt-4 text-blue-600 hover:underline">Xóa bộ lọc và thử lại</button>
      </div>
    </section>
  </div>
</main>

<footer class="bg-gray-900 dark:bg-black text-white py-5 px-4 mt-8 text-center">
  <p class="text-xs text-gray-400">&copy; 2025 Nhóm UTT Student Guide</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/category.js"></script>
</body>
</html>
