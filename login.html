<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - UTT Student Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
      min-height: 100vh;
    }
    .tab-active {
      color: #1e40af;
      border-bottom: 3px solid #1e40af;
      font-weight: 700;
    }
    .tab-inactive {
      color: #9ca3af;
      border-bottom: 3px solid transparent;
    }
  </style>
</head>
<body class="gradient-bg flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- LOGO -->
    <div class="text-center mb-6">
      <a href="index.html" class="inline-flex items-center gap-3 text-white">
        <div class="bg-white/20 backdrop-blur rounded-xl p-3">
          <i class="fas fa-map-marked-alt text-3xl"></i>
        </div>
        <div class="text-left">
          <h1 class="text-2xl font-bold leading-tight">UTT Student Guide</h1>
          <p class="text-xs text-blue-100">Cẩm nang số sinh viên UTT</p>
        </div>
      </a>
    </div>

    <!-- CARD -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- TABS -->
      <div class="flex border-b border-gray-100">
        <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-4 text-center tab-active transition">
          Đăng nhập
        </button>
        <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-4 text-center tab-inactive transition">
          Đăng ký
        </button>
      </div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="loginForm" class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
          <input type="email" id="loginEmail" required
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                 placeholder="sinhvien@st.utt.edu.vn">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Mật khẩu</label>
          <input type="password" id="loginPassword" required minlength="6"
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                 placeholder="••••••">
        </div>
        <button type="submit" id="loginBtn"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
          <i class="fas fa-sign-in-alt mr-2"></i>Đăng nhập
        </button>
        <p class="text-sm text-center text-gray-500">
          Chưa có tài khoản?
          <button type="button" onclick="switchTab('register')" class="text-blue-600 font-semibold hover:underline">
            Đăng ký ngay
          </button>
        </p>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="registerForm" class="p-6 space-y-4 hidden">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Họ và tên</label>
          <input type="text" id="registerNickname" required minlength="2"
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                 placeholder="Nguyễn Văn A">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
          <input type="email" id="registerEmail" required
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                 placeholder="sinhvien@st.utt.edu.vn">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Mật khẩu</label>
          <input type="password" id="registerPassword" required minlength="6"
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                 placeholder="Ít nhất 6 ký tự">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nhập lại mật khẩu</label>
          <input type="password" id="registerPassword2" required minlength="6"
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                 placeholder="••••••">
        </div>
        <button type="submit" id="registerBtn"
                class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
          <i class="fas fa-user-plus mr-2"></i>Tạo tài khoản
        </button>
        <p class="text-sm text-center text-gray-500">
          Đã có tài khoản?
          <button type="button" onclick="switchTab('login')" class="text-blue-600 font-semibold hover:underline">
            Đăng nhập
          </button>
        </p>
      </form>

    </div>

    <!-- QUAY LẠI TRANG CHỦ -->
    <div class="text-center mt-6">
      <a href="index.html" class="text-white/80 hover:text-white text-sm">
        <i class="fas fa-arrow-left mr-1"></i>Quay lại trang chủ
      </a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
