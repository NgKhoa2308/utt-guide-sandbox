<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu - UTT Student Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3a8a, #3b82f6); min-height: 100vh; } </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Đặt lại mật khẩu</h2>
    
    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Mật khẩu mới</label>
        <input type="password" id="newPassword" required minlength="6"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
               placeholder="Ít nhất 6 ký tự">
      </div>
      <button type="submit" id="resetBtn"
              class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
        Cập nhật mật khẩu
      </button>
    </form>
    <p id="message" class="text-center mt-4 text-sm font-semibold hidden"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      const msg = document.getElementById('message');
      const newPassword = document.getElementById('newPassword').value;

      btn.disabled = true;
      btn.innerHTML = 'Đang cập nhật...';

      // Gọi API cập nhật mật khẩu của Supabase
      const { error } = await sb.auth.updateUser({ password: newPassword });

      msg.classList.remove('hidden');
      if (error) {
        msg.className = 'text-center mt-4 text-sm font-semibold text-red-600';
        msg.textContent = '❌ Lỗi: ' + error.message;
        btn.disabled = false;
        btn.innerHTML = 'Cập nhật mật khẩu';
      } else {
        msg.className = 'text-center mt-4 text-sm font-semibold text-green-600';
        msg.textContent = '✅ Đổi mật khẩu thành công! Đang chuyển về trang đăng nhập...';
        setTimeout(() => window.location.href = 'login.html', 2000);
      }
    });
  </script>
</body>
</html>
